name: starttijd-check
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: starttijd-check
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - id: check
        run: python3 check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATES: '2026-11-14'  # leeg = elke week automatisch de eerstvolgende WEEKDAY; datum voorbij = pauze
          WEEKDAY: '5'       # 5 = zaterdag
          TIME_FROM: '09:30'
          TIME_TO: '15:15'
          COURSES: 'rood,geel,blauw'
          MIN_PLAYERS: '1'
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: state
          key: state-${{ github.run_id }}
