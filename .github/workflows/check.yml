name: starttijd-check
on:
  # Gepauzeerd. Weer aanzetten: de twee regels hieronder terugzetten (zonder #) en DATES aanpassen.
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write   # om zelf de volgende run te starten
concurrency:
  group: starttijd-check
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - id: check
        # Elk alarm draait tegelijk als eigen proces, met een eigen geheugen (STATE_FILE).
        # De instellingen hieronder (env) zijn voor alarm 1; extra alarmen overschrijven alleen wat anders is.
        run: |
          python3 check.py &
          TIME_FROM=08:15 TIME_TO=08:40 STATE_FILE=state/seen-ochtend.json python3 check.py &
          wait
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATES: '2026-11-28'  # leeg = elke week automatisch de eerstvolgende WEEKDAY; datum voorbij = pauze
          WEEKDAY: '5'       # 5 = zaterdag
          TIME_FROM: '12:00'
          TIME_TO: '12:40'
          COURSES: 'rood,geel,blauw'
          MIN_PLAYERS: '1'
          LOOP_MINUTES: '120'    # één run kijkt 2 uur door ...
          INTERVAL_SECONDS: '120'  # ... elke 2 minuten
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: state-${{ github.run_id }}
      # GitHub start geplande runs soms urenlang niet. Daarom start elke run zelf de volgende,
      # zolang er nog een datum in de toekomst is. Stopt bij annuleren of als alle data voorbij zijn.
      - name: Volgende run starten
        if: success() && steps.check.outputs.actief == 'true'
        run: gh workflow run check.yml -R ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ github.token }}
