name: starttijd-check
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: starttijd-check
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - id: check
        # Elk alarm draait tegelijk als eigen proces, met een eigen geheugen (STATE_FILE).
        # De instellingen hieronder (env) zijn voor alarm 1; extra alarmen overschrijven alleen wat anders is.
        run: |
          python3 check.py &
          wait
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STATE_FILE: state/seen-zondag.json
          DATES: '2026-11-15'  # leeg = elke week automatisch de eerstvolgende WEEKDAY; datum voorbij = pauze
          WEEKDAY: '5'       # 5 = zaterdag
          TIME_FROM: '12:00'
          TIME_TO: '15:15'
          COURSES: 'rood,geel,blauw'
          MIN_PLAYERS: '1'
          LOOP_MINUTES: '75'     # één run kijkt ruim een uur door ...
          INTERVAL_SECONDS: '120'  # ... elke 2 minuten
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: state-${{ github.run_id }}
