name: discover
on:
  push:
    paths: ['tools/discover.js', '.github/workflows/discover.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tools/discover.js
        env:
          TARGET_URL: https://www.delflandgolf.nl/reserveer-starttijd/reserveren-starttijd/
      - name: Resultaten naar branch discovery-output
        if: always()
        run: |
          mkdir -p /tmp/o && cp discover.log *.html page.png /tmp/o/ 2>/dev/null || true
          git config user.name github-actions && git config user.email actions@github.com
          git checkout --orphan discovery-output && git rm -rqf . && cp /tmp/o/* . && git add -A
          git commit -qm "discovery output" && git push -f origin discovery-output
