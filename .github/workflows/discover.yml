name: discover
on:
  push:
    paths: ['.github/workflows/discover.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Ophalen
        run: |
          mkdir o && cd o
          curl -sS https://cdn.intogolf.nl/teetime.js -o teetime.js
          curl -sS "https://delfland.baan.intogolf.nl/api/igg?date=2026-10-31&locNr=29" -o igg-2026-10-31.json
          curl -sS "https://delfland.baan.intogolf.nl/api/igg?date=2026-10-28&locNr=29" -o igg-2026-10-28.json
          curl -sS -D headers.txt -o /dev/null "https://delfland.baan.intogolf.nl/api/igg?date=2026-10-31&locNr=29"
      - name: Resultaten naar branch discovery-output
        run: |
          cd o && git init -q && git checkout -qb discovery-output
          git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "discovery output 2"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" discovery-output
