# GitHub zet geplande workflows in een openbare repo uit na 60 dagen zonder activiteit.
# Deze workflow maakt elke maand een kleine commit, zodat de starttijd-check blijft draaien.
name: keepalive
on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%d > .keepalive
          git config user.name github-actions && git config user.email actions@github.com
          git add .keepalive && git commit -qm "keepalive [skip ci]" && git push
