name: testmelding
on:
  push:
    paths: ['.github/workflows/test.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_RUN: '1'
          DATES: '2026-10-31'
          TIME_FROM: '11:15'
          TIME_TO: '13:45'
